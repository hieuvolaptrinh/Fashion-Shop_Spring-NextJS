spring.application.name=healthy_store
server.port=8081
spring.config.import=optional:dotenv:

# Kết nối MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/healthy_store?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh

# spring.datasource.url=jdbc:mysql://shuttle.proxy.rlwy.net:35672/railway?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# spring.datasource.url=jdbc:mysql://shortline.proxy.rlwy.net:37854/railway?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.jpa.properties.hibernate.connection.useSSL=false
spring.jpa.properties.hibernate.connection.requireSSL=false
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Frontend URL cho chuyển hướng OAuth2
frontend.url=${URL_FE:http://localhost:3000}

# config OAuth2 Google Login
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri=${BASE_API}/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-name=Google
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://www.googleapis.com/oauth2/v4/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs
spring.security.oauth2.client.provider.google.user-name-attribute=sub

# config OAuth2 Facebook Login
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET}
spring.security.oauth2.client.registration.facebook.scope=public_profile
spring.security.oauth2.client.registration.facebook.redirect-uri=${BASE_API}/login/oauth2/code/facebook
spring.security.oauth2.client.registration.facebook.client-name=Facebook
spring.security.oauth2.client.provider.facebook.authorization-uri=https://www.facebook.com/v18.0/dialog/oauth
spring.security.oauth2.client.provider.facebook.token-uri=https://graph.facebook.com/v18.0/oauth/access_token
spring.security.oauth2.client.provider.facebook.user-info-uri=https://graph.facebook.com/v18.0/me?fields=id,name
spring.security.oauth2.client.provider.facebook.user-name-attribute=id

# Cloudinary
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}

# Security và HTTPS
server.forward-headers-strategy=native

# Static content và security headers
spring.web.resources.add-mappings=true

# Zalo ZNS
zalo.zns.access-token=
zalo.zns.api-url=https://business.openapi.zalo.me/message/template
zalo.zns.template-id=

# ==========================================
# CẤU HÌNH AI CHATBOT (GOOGLE GEMINI)
# ==========================================
# Cấu hình danh sách API Key phân tách bởi dấu phẩy (Key Pool hỗ trợ Multi-Key Rotation)
gemini.api.keys=${GEMINI_API_KEYS:AIzaSy_demo_key_placeholder}
gemini.api.model=${GEMINI_MODEL:gemini-1.5-flash}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models
gemini.api.max-output-tokens=1024
gemini.api.temperature=0.7

# Chống spam (Rate Limiting)
chat.ratelimit.max-requests-per-minute=10
chat.ratelimit.max-message-length=500